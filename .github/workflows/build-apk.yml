name: Build Android APK

on:
  workflow_dispatch:

env:
  ANDROIDSDK: /home/runner/android-sdk
  ANDROIDNDK: /home/runner/android-sdk/ndk/27.2.12479018
  ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup writable Android SDK root
        run: |
          mkdir -p /home/runner/android-sdk
          chmod -R 777 /home/runner/android-sdk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK, Build-tools and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Verify NDK Directory
        run: ls -la /home/runner/android-sdk/ndk/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential cmake libffi-dev libssl-dev autoconf libtool pkg-config
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.33

      - name: Download local Qwen model
        run: bash scripts/download_model.sh

      - name: Build embedded llama.cpp runtime
        run: bash scripts/build_native_android.sh

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itog-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14